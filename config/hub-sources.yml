schema_version: "1.0"

hub:
  name: "Bacus Hub Universe"
  repository: "ciberspar/bacus-hub-Universe"
  package_manager: "Bacusp"
  output_format: "bp"

discovery:
  automatic:
    enabled: true
    interval_hours: 24
    inspect_repositories: true
    inspect_releases: true
    inspect_source_manifests: true

  manual:
    enabled: true
    search_by_name: true
    search_by_url: true
    search_by_category: true

sources:
  - id: github
    adapter: github
    enabled: true
    public_repositories: true
    inspect_releases: true

  - id: gitlab
    adapter: gitlab
    enabled: true
    public_repositories: true
    inspect_releases: true

  - id: codeberg
    adapter: codeberg
    enabled: true
    public_repositories: true
    inspect_releases: true

  - id: generic_git
    adapter: git
    enabled: true
    public_repositories: true

source_detection:
  enabled: true
  detect_languages: true
  detect_build_system: true
  detect_dependencies: true
  detect_license: true
  detect_architecture: true

  manifests:
    - CMakeLists.txt
    - Makefile
    - configure
    - meson.build
    - Cargo.toml
    - package.json
    - pyproject.toml
    - setup.py
    - go.mod
    - pom.xml
    - build.gradle
    - "*.sln"
    - "*.vcxproj"

targets:
  linux:
    - debian
    - ubuntu
    - opensuse
    - arch
    - alpine
    - fedora

  bsd:
    - freebsd
    - openbsd

  unix:
    - solaris
    - illumos

  microkernel:
    - hurd
    - minix

  alternative:
    - serenity
    - haiku
    - plan9
    - kolibrios

  desktop:
    - windows

  legacy:
    - dos

  mobile:
    - android
    - termux
    - ios

  embedded:
    - rtos

compatibility:
  detection: automatic
  require_target_validation: true
  never_claim_untested_compatibility: true

  levels:
    - native
    - compatible
    - experimental
    - unsupported

catalog:
  enabled: true
  include_source_url: true
  include_license: true
  include_supported_targets: true
  include_security_status: true
  include_build_information: true
  include_sha256: true
  require_approval_before_publication: true
