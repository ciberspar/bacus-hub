
name: Deploy Bacus Hub

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "catalog/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate catalog and build site
        run: |
          set -eu

          python3 -m json.tool catalog/packages.json >/dev/null

          head -n 1 catalog/packages.tsv |
            grep -q 'id.*name.*version.*description.*platforms.*url.*sha256'

          mkdir -p _site/catalog

          cp -R web/. _site/
          cp catalog/packages.json _site/catalog/packages.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
