
name: Update Bacus Hub catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "sources/repos.txt"
      - "scripts/update_catalog.py"
      - ".github/workflows/update-catalog.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate catalog
        run: python scripts/update_catalog.py

      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/packages.json catalog/packages.tsv
          if ! git diff --cached --quiet; then
            git commit -m "Update package catalog"
            git push
          fi
