name: Bacus Hub Universe - Source Discovery

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sources:
    name: Check discovery configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Check enabled sources
        run: |
          python - <<'PY'
          import yaml

          path = "config/hub-sources.yaml"

          with open(path, encoding="utf-8") as file:
              config = yaml.safe_load(file)

          sources = config.get("sources", [])
          enabled = [
              source for source in sources
              if source.get("enabled") is True
          ]

          if not enabled:
              raise SystemExit("No enabled sources configured.")

          print("BACUS HUB UNIVERSE")
          print("Configured discovery sources:")

          for source in enabled:
              print(
                  f"- {source['id']}: "
                  f"{source.get('adapter', 'unknown')}"
              )

          print("Configuration check completed.")
          PY
